<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <input type="password" id="password" width="">

    <img src="/projects/10863657.png" alt="Eye Icon" width="30"  onclick="togglePassword()">

    <script>
    function togglePassword(){
        const input = document.getElementById("password")
        if(input.type== "password"){
            input.type = "text"
        }else{
            input.type = "hide"
        }
    }
    </script>
</body>
</html>

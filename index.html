<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .product img {
            width: 150px;
            height: 180px;
            object-fit: contain;
        }

        .product h2 {
            font-size: 18px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .rating {
            color: orange;
        }
    </style>
</head>

<body>

    <h1>All Products</h1>

    <div id="products"></div>

    <script>

        // Fetch all products
        fetch("https://fakestoreapi.com/products")

            // Convert response to JavaScript object
            .then(response => response.json())

            // Get all products
            .then(products => {

                console.log(products);

                // Select products container
                const productsContainer =
                    document.getElementById("products");

                // Loop through all products
                products.forEach(product => {

                    // Create product card
                    productsContainer.innerHTML += `

                        <div class="product">

                            <h2>${product.title}</h2>

                            <img 
                                src="${product.image}" 
                                alt="${product.title}"
                            >

                            <p class="price">
                                $${product.price}
                            </p>

                            <p>
                                ${product.description}
                            </p>

                            <p>
                                Category: ${product.category}
                            </p>

                            <p class="rating">
                                ⭐ ${product.rating.rate}
                            </p>

                            <p>
                                Reviews: ${product.rating.count}
                            </p>

                        </div>

                    `;

                });

            })

            // Handle errors
            .catch(error => {

                console.log("Error:", error);

                document.getElementById("products").innerHTML =
                    "<h2>Failed to fetch products</h2>";

            });

    </script>

</body>

</html>
